<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBlog</title>
    <link rel="stylesheet" href="https://unpkg.com/@primer/css/dist/primer.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* ========== 全局重置与基础样式 ========== */
        :root {
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #e4edf5;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #5a6270;
            --accent-color: #6c5ce7;
            --accent-gradient: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --shadow-light: 0 4px 15px rgba(108, 92, 231, 0.08);
            --shadow-hover: 0 8px 25px rgba(108, 92, 231, 0.15);
        }

        [data-color-mode="dark"] {
            --bg-gradient-start: #0f0f1a;
            --bg-gradient-end: #1a1a2e;
            --card-bg: rgba(30, 30, 50, 0.8);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #e4e4f0;
            --text-secondary: #9a9ab0;
            --shadow-light: 0 4px 15px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 25px rgba(108, 92, 231, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.7;
            transition: background 0.4s ease, color 0.3s ease;
        }

        /* ========== 页面容器 ========== */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 头部区域 ========== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 32px;
            margin-bottom: 36px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--shadow-light);
            transition: box-shadow 0.3s ease;
        }

        header:hover {
            box-shadow: var(--shadow-hover);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        /* 头像样式 */
        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid transparent;
            background: var(--accent-gradient) border-box;
            padding: 3px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            cursor: pointer;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }

        .avatar:hover {
            transform: scale(1.1) rotate(8deg);
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.4);
        }

        /* 标题样式 */
        .site-title {
            font-size: 1.6rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .site-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* 头部右侧按钮 */
        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-actions button,
        .header-actions a {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .header-actions button:hover,
        .header-actions a:hover {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            transform: translateY(-2px);
        }

        /* ========== 搜索框 ========== */
        .search-box {
            margin-bottom: 28px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-light);
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            opacity: 0.5;
        }

        /* ========== 文章列表（卡片式） ========== */
        .post-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post-item {
            display: flex;
            flex-direction: column;
            padding: 22px 26px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            box-shadow: var(--shadow-light);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-decoration: none;
            color: inherit;
        }

        .post-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(108, 92, 231, 0.3);
        }

        .post-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            transition: color 0.2s ease;
        }

        .post-item:hover .post-title {
            color: var(--accent-color);
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .post-date {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        /* 标签胶囊样式 */
        .tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            background: var(--accent-gradient);
            color: #fff;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .tag:hover {
            transform: scale(1.08);
            opacity: 0.9;
        }

        /* ========== 页脚 ========== */
        footer {
            text-align: center;
            padding: 32px 20px;
            margin-top: 48px;
            color: var(--text-secondary);
            font-size: 0.88rem;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* ========== 滚动条美化 ========== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(108, 92, 231, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(108, 92, 231, 0.5);
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 640px) {
            .container {
                padding: 20px 16px;
            }

            header {
                flex-direction: column;
                gap: 16px;
                padding: 20px;
                text-align: center;
            }

            .header-left {
                flex-direction: column;
            }

            .site-title {
                font-size: 1.35rem;
            }

            .post-item {
                padding: 18px 20px;
            }

            .post-title {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header>
            <div class="header-left">
                <div class="avatar">
                    <img src="https://avatars.githubusercontent.com/u/your-avatar-id" alt="Avatar" id="avatar-img">
                </div>
                <div>
                    <h1 class="site-title" id="site-title">StudyBlog</h1>
                    <p class="site-subtitle" id="site-subtitle">记录学习，分享知识</p>
                </div>
            </div>
            <div class="header-actions">
                <a href="/rss.xml" title="RSS 订阅">📡 RSS</a>
                <button id="theme-toggle" title="切换主题">🌙</button>
            </div>
        </header>

        <!-- 搜索框 -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="搜索文章..." />
        </div>

        <!-- 文章列表 -->
        <ul class="post-list" id="post-list">
            <!-- Gmeek 会自动在此处插入文章列表 -->
        </ul>

        <!-- 页脚 -->
        <footer>
            <p>Powered by <a href="https://github.com/Meekdai/Gmeek" target="_blank">Gmeek</a> · Built with ❤️</p>
        </footer>
    </div>

    <script>
        // ========== 主题切换逻辑 ==========
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        function setTheme(mode) {
            html.setAttribute('data-color-mode', mode);
            localStorage.setItem('theme', mode);
            themeToggle.textContent = mode === 'dark' ? '☀️' : '🌙';
        }

        // 初始化主题
        const savedTheme = localStorage.getItem('theme') || 'auto';
        if (savedTheme === 'auto') {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(prefersDark ? 'dark' : 'light');
        } else {
            setTheme(savedTheme);
        }

        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-color-mode');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        // ========== 搜索功能 ==========
        const searchInput = document.getElementById('search-input');
        const postList = document.getElementById('post-list');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const items = postList.querySelectorAll('.post-item');
            items.forEach(item => {
                const title = item.querySelector('.post-title')?.textContent.toLowerCase() || '';
                item.style.display = title.includes(query) ? '' : 'none';
            });
        });

        // ========== 动态加载头像（从 config.json） ==========
        fetch('/config.json')
            .then(res => res.json())
            .then(config => {
                if (config.avatarUrl) {
                    document.getElementById('avatar-img').src = config.avatarUrl;
                }
                if (config.name) {
                    document.getElementById('site-title').textContent = config.name;
                }
                if (config.description) {
                    document.getElementById('site-subtitle').textContent = config.description;
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
